<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    <br>
    <h2>Lista de Clientes</h2><br>
    
    <table class="table"> 
        <thead>
            <tr>
                <th>ID</th> 
                <th>Rut</th>
                <th>Digito verificador</th>
                <th>Nombre</th>
                <th>Segundo nombre</th>
                <th>Apellido Paterno</th>
                <th>Apellido Materno</th>
                <th>Fecha de Nacimiento</th>
                <th>Correo electrónico</th>
                <th>Telefono de contacto</th>
                <th>Comuna</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="unCliente:${clientes}"> 
                <td th:text="${unCliente.id}"></td>
                <td th:text="${unCliente.rut}"></td>
                <td th:text="${unCliente.dv}"></td>
                <td th:text="${unCliente.pnombre}"></td>
                <td th:text="${unCliente.snombre}"></td>
                <td th:text="${unCliente.apPaterno}"></td>
                <td th:text="${unCliente.apMaterno}"></td>
                <td th:text="${unCliente.nacimiento}"></td>
                <td th:text="${unCliente.correo}"></td>
                <td th:text="${unCliente.telefono}"></td>
                <td th:text="${unCliente.comuna}"></td>
            </tr>
        </tbody>

    </table>
</body>
</html>
