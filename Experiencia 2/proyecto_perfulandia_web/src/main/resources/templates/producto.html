<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body class ="container">
    <br>
    <h2>Lista Productos</h2><br>
    
    <table class="table"> 
        <thead>
            <tr>
                <th>ID</th> 
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Porcentaje Descuento</th>
                <th>Marca</th>
                <th>Tamaño (ml)</th>
                <th>Stock</th>
                <th>Categoria 1</th>
                <th>Categoria 2</th>
                <th>Categoria 3</th>
                <th>Imagen</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="unProducto:${productos}">
                <td th:text="${unProducto.id}"></td>
                <td th:text="${unProducto.nombre}"></td>
                <td th:text="${unProducto.descripcion}"></td>
                <td th:text="${unProducto.precio}"></td>
                <td th:text="${unProducto.descuentoporc}"></td>
                <td th:text="${unProducto.marca}"></td>
                <td th:text="${unProducto.tamano}"></td>
                <td th:text="${unProducto.stock}"></td>
                <td th:text="${unProducto.categoria1}"></td>
                <td th:text="${unProducto.categoria2}"></td>
                <td th:text="${unProducto.categoria3}"></td>
                <td th:text="${unProducto.nombreImg}"></td>
            </tr>
        </tbody>

</body>
</html>
