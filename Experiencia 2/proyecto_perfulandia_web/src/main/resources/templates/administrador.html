<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body class ="container">
    <br>
    <h2>Lista de Administración</h2><br>

    
    <table class="table"> 
        <thead>
            <tr>
                <th>ID</th> 
                <th>Rut</th>
                <th>Digito verificador</th>
                <th>Nombre</th>
                <th>Segundo nombre</th>
                <th>Apellido Paterno</th>
                <th>Apellido Materno</th>
                <th>Fecha de Nacimiento</th>
                <th>Correo electrónico</th>
                <th>Telefono de contacto</th>
                <th>Estado Cuenta</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="unAdministrador:${administradores}"> 
                <td th:text="${unAdministrador.id}"></td>
                <td th:text="${unAdministrador.rut}"></td>
                <td th:text="${unAdministrador.dv}"></td>
                <td th:text="${unAdministrador.pnombre}"></td>
                <td th:text="${unAdministrador.snombre}"></td>
                <td th:text="${unAdministrador.apPaterno}"></td>
                <td th:text="${unAdministrador.apMaterno}"></td>
                <td th:text="${unAdministrador.nacimiento}"></td>
                <td th:text="${unAdministrador.correo}"></td>
                <td th:text="${unAdministrador.telefono}"></td>
                <td th:text="${unAdministrador.estado}"></td>
            </tr>
        </tbody>

    </table>

</body>
</html>
