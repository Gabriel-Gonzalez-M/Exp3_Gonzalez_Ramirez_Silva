<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body class ="container">
    <br>
    <h2>Lista de Gerentes</h2><br>

    <table class="table"> 
        <thead>
            <tr>
                <th>ID</th> 
                <th>Rut</th>
                <th>Digito verificador</th>
                <th>Nombre</th>
                <th>Apellido Paterno</th>
                <th>Apellido Materno</th>
                <th>Fecha de Nacimiento</th>
                <th>Correo electrónico</th>
                <th>Turno</th>
                <th>Id Sucursal</th>
                <th>Estado</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="unGerente:${gerentes}"> 
                <td th:text="${unGerente.id}"></td>
                <td th:text="${unGerente.rut}"></td>
                <td th:text="${unGerente.dv}"></td>
                <td th:text="${unGerente.pnombre}"></td>
                <td th:text="${unGerente.apPaterno}"></td>
                <td th:text="${unGerente.apMaterno}"></td>
                <td th:text="${unGerente.nacimiento}"></td>
                <td th:text="${unGerente.correo}"></td>
                <td th:text="${unGerente.turno}"></td>
                <td th:text="${unGerente.idSucursal}"></td>
                <td th:text="${unGerente.estado}"></td>
            </tr>
        </tbody>


    
</body>
</html>
