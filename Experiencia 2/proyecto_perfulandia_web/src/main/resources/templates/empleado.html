<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body class ="container">
    <br>
    <h2>Lista de Empleados</h2><br>
    
    <table class="table"> 
        <thead>
            <tr>
                <th>ID</th> 
                <th>Rut</th>
                <th>Digito verificador</th>
                <th>Nombre</th>
                <th>Apellido Paterno</th>
                <th>Apellido Materno</th>
                <th>Fecha de Nacimiento</th>
                <th>Correo electrónico</th>
                <th>Turno</th>
                <th>Id Sucursal</th>
                <th>Estado</th>
            </tr>

        </thead>
        <tbody>
            <tr th:each="unEmpleado:${empleados}"> 
                <td th:text="${unEmpleado.id}"></td>
                <td th:text="${unEmpleado.rut}"></td>
                <td th:text="${unEmpleado.dv}"></td>
                <td th:text="${unEmpleado.pnombre}"></td>
                <td th:text="${unEmpleado.apPaterno}"></td>
                <td th:text="${unEmpleado.apMaterno}"></td>
                <td th:text="${unEmpleado.nacimiento}"></td>
                <td th:text="${unEmpleado.correo}"></td>
                <td th:text="${unEmpleado.turno}"></td>
                <td th:text="${unEmpleado.idSucursal}"></td>
                <td th:text="${unEmpleado.estado}"></td>
            </tr>
        </tbody>


</body>
</html>
