spring.application.name=proyecto_perfulandia_web

#parametros de la conexion
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?serverTimezone=UTC&useSSL=false
spring.datasource.username=root

#configuracion de JPA (si ya existe que me la actualize y no la borre)
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#configuracion de logs (Habilitar los mensajes en la consola (opcional))
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format-sql=true